name: finetune
# Manual: trains the small classifier on CPU and scores it on sentinel-eval's blind set.
on: workflow_dispatch

defaults:
  run:
    shell: bash

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yurtseveronder-design/sentinel-eval
          path: .eval
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install "transformers>=4.46" datasets accelerate
      - name: Build the training set (drops anything that also appears in the eval sets)
        run: python training/build_dataset.py --eval-dir .eval/data --out data/train.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Train, choose threshold on validation, evaluate
        run: python training/finetune.py --train data/train.jsonl --eval-dir .eval/data --out model_out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: model, path: "model_out\ndata/datacard.json"}
